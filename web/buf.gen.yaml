# Generates TypeScript message types (@bufbuild/protobuf) and Connect clients
# (@connectrpc/connect) for the dashboard SPA. The browser uses these with
# @connectrpc/connect-web to talk to the vanguard transcoder under /grpc.
#
# Run via `make proto-ts` (or `cd web && buf generate`). Requires:
#   npm i -D @bufbuild/protoc-gen-es @connectrpc/protoc-gen-connect-es
version: v2
plugins:
  - local: protoc-gen-es
    out: src/gen
    opt:
      - target=ts
  - local: protoc-gen-connect-es
    out: src/gen
    opt:
      - target=ts
