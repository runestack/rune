<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- Rune mark: serif "r." echoing the "rune." wordmark — cream r + accent dot
       on the warm near-black brand surface. -->
  <rect width="32" height="32" rx="7" fill="#161513"/>
  <text x="9" y="23"
        font-family="Spectral, Georgia, 'Times New Roman', serif"
        font-size="22" font-weight="500" letter-spacing="-0.5"
        fill="#ece8e1">r<tspan fill="#9e8cfc">.</tspan></text>
</svg>
