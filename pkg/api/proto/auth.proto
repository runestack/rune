syntax = "proto3";
package rune.api;
option go_package = "github.com/runestack/rune/pkg/api/generated";

// HTTP annotations are optional; omit to avoid dependency for now

message WhoAmIRequest {}
message WhoAmIResponse {
  string subject_id = 1;
  string subject_name = 2;  // User's display name
  string subject_email = 3; // User's email address
  repeated string policies = 4;
}

message CreateTokenRequest {
  string name = 1;
  string subject_id = 2;
  string subject_name = 3;
  string subject_type = 4; // user|service
  repeated string policies = 5; // repurposed to carry default policies on auto-create
  int64 ttl_seconds = 6; // 0 for no expiry
  string description = 7;
  // kind selects the credential type (RUNE-201): "" or "legacy" issues a
  // long-lived bearer (the default; used by service accounts / break-glass);
  // "refresh" issues a refresh grant that is exchanged at /v1/auth/refresh for
  // short-lived access tokens. "access" is not directly issuable here.
  string kind = 8;
}
message CreateTokenResponse {
  string id = 1;
  string name = 2;
  string secret = 3; // returned once
}

message RevokeTokenRequest {
  string id = 1;
}
message RevokeTokenResponse {
  bool revoked = 1;
}

// RUNE-201 session refresh. Self-authenticating on the refresh secret itself
// (no RBAC verb) — exempt from the auth/rbac interceptors like AdminBootstrap.
// The CLI uses this gRPC method; browsers use the HTTP cookie endpoint at
// /v1/auth/refresh.
message RefreshRequest {
  string refresh_token = 1;
}
message RefreshResponse {
  string access_token = 1;
  string refresh_token = 2; // rotated successor
  int64 expires_at = 3;     // access token expiry, unix seconds; 0 = no expiry
}

// RUNE-201 Phase 2 enrollment. An admin issues a one-time, short-TTL code that
// authorizes creating ONE refresh grant for a named subject with a fixed policy
// set — the code is NOT a usable credential. The user redeems it on their own
// machine and receives the refresh secret directly, so the admin never handles
// a working credential.
message EnrollRequest {
  string subject_name = 1;        // subject the redeemer will become
  string subject_type = 2;        // user|service (default user)
  repeated string policies = 3;   // policies attached on (auto-)create
  int64 ttl_seconds = 4;          // code lifetime; 0 → server default (10m)
}
message EnrollResponse {
  string code = 1;
  int64 expires_at = 2; // unix seconds
}

message RedeemEnrollmentRequest {
  string code = 1;
  string grant_name = 2; // device/surface label for the new grant (e.g. host)
}
message RedeemEnrollmentResponse {
  string access_token = 1;
  string refresh_token = 2;
  int64 expires_at = 3;  // access token expiry, unix seconds
  string subject_id = 4;
}

service AuthService {
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc CreateToken(CreateTokenRequest) returns (CreateTokenResponse);
  rpc RevokeToken(RevokeTokenRequest) returns (RevokeTokenResponse);
  rpc Refresh(RefreshRequest) returns (RefreshResponse);
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
  rpc RedeemEnrollment(RedeemEnrollmentRequest) returns (RedeemEnrollmentResponse);
}


