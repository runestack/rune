syntax = "proto3";

package rune.api;

import "pkg/api/proto/common.proto";

option go_package = "github.com/runestack/rune/pkg/api/generated";

// ObserveService is the native observability (RuneSight) query + ingest seam.
// It serves the dashboard Logs screen and the `rune logs` history path, and
// receives forwarded batches from the agent forwarder. It inherits the API
// server's bearer-token auth + RBAC (resource "logs", verb "observe").
//
// Timestamps are RFC3339 strings (matching the rest of the rune API surface,
// e.g. secret.proto); empty means "unset".

// LogRecord mirrors observe.LogRecord: an enriched log line on the wire. The
// fixed dimensions (namespace/service/instance/node) are Rune-native identity
// stamped by the forwarder; labels carries arbitrary stream labels.
message LogRecord {
  string timestamp = 1; // RFC3339
  string line = 2;
  string stream = 3; // "stdout" | "stderr" | "event"
  string level = 4;  // "info" | "warn" | "error" | ... ("" if unclassified)

  string namespace = 5;
  string service = 6;
  string instance = 7;
  string node = 8;
  map<string, string> labels = 9;
}

// --- Ingest (forwarder -> control plane) ---

message PushLogsRequest {
  repeated LogRecord records = 1;
}

message PushLogsResponse {
  // Number of records accepted and durably enqueued for write.
  uint32 accepted = 1;
  Status status = 2;
}

// --- Query ---

// ObserveQuery carries LogQL text plus the time window. The server parses the
// LogQL subset into the observe.Query AST (clients never send the AST).
message ObserveQuery {
  string logql = 1;
  string start = 2; // RFC3339
  string end = 3;   // RFC3339
  uint32 limit = 4;
  bool forward = 5; // true => oldest-first
  string namespace = 6;
}

message LogRow {
  string timestamp = 1; // RFC3339
  string line = 2;
  string stream = 3;
  string level = 4;
  map<string, string> labels = 5;
}

message MetricSample {
  string timestamp = 1; // RFC3339 (bucket left edge)
  double value = 2;
  map<string, string> group_labels = 3;
}

// QueryResult is one streamed result element: exactly one of row/sample is set,
// matching the observe.ResultStream IsMetric contract.
message QueryResult {
  oneof result {
    LogRow row = 1;
    MetricSample sample = 2;
  }
}

// --- Saved views ---

// SavedView mirrors types.SavedView: a named, reusable Log Explorer query
// (LogQL + relative time-range token). Cluster-scoped and shared.
message SavedView {
  string id = 1;
  string name = 2; // DNS-1123 cluster-unique
  string description = 3;
  string logql = 4;
  string range = 5; // relative token: "15m" | "1h" | "24h" | ...
  bool pinned = 6;
  string created_by = 7;
  string created_at = 8; // RFC3339
  string updated_at = 9; // RFC3339
}

message ListSavedViewsRequest {}

message ListSavedViewsResponse {
  repeated SavedView views = 1;
}

message SaveViewRequest {
  // Upsert by name: create when absent, update otherwise.
  SavedView view = 1;
}

message SaveViewResponse {
  SavedView view = 1;
  Status status = 2;
}

message DeleteSavedViewRequest {
  string name = 1;
}

message DeleteSavedViewResponse {
  Status status = 2;
}

// --- Alerting ---

// AlertRule mirrors types.AlertRule: a LogQL count threshold evaluated by the
// runed alerter. Durations are strings in Go syntax ("5m", "90s").
message AlertRule {
  string id = 1;
  string name = 2; // DNS-1123 cluster-unique
  string description = 3;
  string logql = 4;     // plain log selector; the alerter adds count_over_time
  string window = 5;    // rolling count window
  string op = 6;        // > >= < <= ==
  double threshold = 7;
  string for = 8;       // pending->firing hysteresis ("" => fire immediately)
  string interval = 9;  // evaluation cadence ("" => 60s)
  repeated string channels = 10;
  bool disabled = 11;
  string created_by = 12;
  string created_at = 13; // RFC3339
  string updated_at = 14; // RFC3339
}

// AlertStatus is a rule's live evaluation state (held by the alerter).
message AlertStatus {
  string rule = 1;
  string state = 2; // ok | pending | firing
  double value = 3;
  string since = 4;      // RFC3339 — when the current state began
  string last_eval = 5;  // RFC3339
  string last_error = 6; // "" when healthy
}

// Channel mirrors types.Channel: a templated-webhook notification target.
message Channel {
  string id = 1;
  string name = 2; // DNS-1123 cluster-unique
  string type = 3; // webhook | slack
  string url = 4;
  map<string, string> headers = 5; // values may hold ${secret:ns/name/key}
  string body = 6;                 // Go text/template; "" => default payload
  string created_at = 7;           // RFC3339
  string updated_at = 8;           // RFC3339
}

message ListAlertRulesRequest {}

message ListAlertRulesResponse {
  repeated AlertRule rules = 1;
  // Statuses for known rules, keyed implicitly by AlertStatus.rule.
  repeated AlertStatus statuses = 2;
}

message SaveAlertRuleRequest {
  AlertRule rule = 1; // upsert by name
}

message SaveAlertRuleResponse {
  AlertRule rule = 1;
  Status status = 2;
}

message DeleteAlertRuleRequest {
  string name = 1;
}

message DeleteAlertRuleResponse {
  Status status = 2;
}

message ListChannelsRequest {}

message ListChannelsResponse {
  repeated Channel channels = 1;
}

message SaveChannelRequest {
  Channel channel = 1; // upsert by name
}

message SaveChannelResponse {
  Channel channel = 1;
  Status status = 2;
}

message DeleteChannelRequest {
  string name = 1;
}

message DeleteChannelResponse {
  Status status = 2;
}

// --- Store stats (Sources page) ---

message ObserveStatsRequest {}

// ObserveStats are store-level facts for the dashboard Sources page. Only
// stores that own their storage (embedded) report them; external backends
// (loki/clickhouse) manage their own storage and report supported=false.
message ObserveStats {
  string backend = 1;
  bool supported = 2; // false => storage managed by the backend
  int64 records = 3;
  int64 disk_used_bytes = 4;
  int64 disk_cap_bytes = 5;       // 0 = unbounded
  double retention_days = 6;       // 0 = default, negative = disabled
  string oldest_record = 7;        // RFC3339; "" when empty
}

message CapabilitiesRequest {}

// ObserveCapabilities mirrors observe.Capabilities for the dashboard handshake.
message ObserveCapabilities {
  string backend = 1;
  string max_tier = 2; // "core" | "advanced"
  bool raw_sql = 3;
  bool percentiles = 4;
  bool high_cardinality_filters = 5;
  bool enabled = 6; // false when observability is disabled (no backend wired)
  // parsers is true when the backend evaluates `| logfmt` / `| json` pipeline
  // stages and post-parse label filters (embedded, loki; not clickhouse yet).
  bool parsers = 7;
}

service ObserveService {
  // Execute parses the LogQL subset, runs it, and server-streams results.
  rpc Execute(ObserveQuery) returns (stream QueryResult);

  // GetCapabilities reports the backend handshake for dashboard feature-flags.
  rpc GetCapabilities(CapabilitiesRequest) returns (ObserveCapabilities);

  // PushLogs ingests forwarded batches. In single-node deployments the agent
  // forwarder writes through an in-process path instead; this RPC is the
  // multi-node transport.
  rpc PushLogs(PushLogsRequest) returns (PushLogsResponse);

  // Saved views: named, reusable Log Explorer queries (cluster-shared).
  // SaveView upserts by name and validates the LogQL before persisting.
  rpc ListSavedViews(ListSavedViewsRequest) returns (ListSavedViewsResponse);
  rpc SaveView(SaveViewRequest) returns (SaveViewResponse);
  rpc DeleteSavedView(DeleteSavedViewRequest) returns (DeleteSavedViewResponse);

  // Alerting: rules (LogQL count thresholds evaluated by the runed alerter)
  // and channels (templated-webhook notification targets). Save RPCs upsert
  // by name and validate the LogQL / URL before persisting.
  rpc ListAlertRules(ListAlertRulesRequest) returns (ListAlertRulesResponse);
  rpc SaveAlertRule(SaveAlertRuleRequest) returns (SaveAlertRuleResponse);
  rpc DeleteAlertRule(DeleteAlertRuleRequest) returns (DeleteAlertRuleResponse);
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  rpc SaveChannel(SaveChannelRequest) returns (SaveChannelResponse);
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);

  // GetObserveStats reports store-level facts (records, disk, retention) for
  // the dashboard Sources page. Volume/coverage numbers come from ordinary
  // metric queries via Execute, not from this RPC.
  rpc GetObserveStats(ObserveStatsRequest) returns (ObserveStats);
}
