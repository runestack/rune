syntax = "proto3";

package rune.api;

import "pkg/api/proto/common.proto";

option go_package = "github.com/runestack/rune/pkg/api/generated";

message Configmap {
  string name = 1;
  string namespace = 2;
  map<string, string> data = 3;
  int32 version = 4;
  string created_at = 5;
  string updated_at = 6;
}

message CreateConfigmapRequest { 
  Configmap configmap = 1;
  bool ensure_namespace = 2;
}
message GetConfigmapRequest { string name = 1; string namespace = 2; }
message UpdateConfigmapRequest { Configmap configmap = 1; }
message DeleteConfigmapRequest { string name = 1; string namespace = 2; }
message ListConfigmapsRequest { 
  string namespace = 1;
  map<string, string> label_selector = 2;
  map<string, string> field_selector = 3;
  PagingParams paging = 4;
}

// PatchConfigmapRequest performs a key-scoped merge update of a configmap's
// data. Set entries upsert; unset keys are removed. The server reads the
// current data map, applies the merge under a per-configmap lock, and writes a
// new version atomically. If the result equals the current head it is a no-op.
message PatchConfigmapRequest {
  string name = 1;
  string namespace = 2;
  // Keys to upsert into the existing data map. Values are taken verbatim.
  map<string, string> set = 3;
  // Keys to remove from the existing data map. Missing keys are ignored.
  repeated string unset = 4;
}

message ListConfigmapVersionsRequest {
  string name = 1;
  string namespace = 2;
}

message ListConfigmapVersionsResponse {
  // Versions are returned newest-first by Configmap.version.
  repeated Configmap versions = 1;
  Status status = 2;
}

message RollbackConfigmapRequest {
  string name = 1;
  string namespace = 2;
  int32 to_version = 3;
}

message ConfigmapResponse { Configmap configmap = 1; Status status = 2; }
message ListConfigmapsResponse { repeated Configmap configmaps = 1; Status status = 2; }

service ConfigmapService {
  rpc CreateConfigmap(CreateConfigmapRequest) returns (ConfigmapResponse);
  rpc GetConfigmap(GetConfigmapRequest) returns (ConfigmapResponse);
  rpc UpdateConfigmap(UpdateConfigmapRequest) returns (ConfigmapResponse);
  rpc PatchConfigmap(PatchConfigmapRequest) returns (ConfigmapResponse);
  rpc DeleteConfigmap(DeleteConfigmapRequest) returns (Status);
  rpc ListConfigmaps(ListConfigmapsRequest) returns (ListConfigmapsResponse);
  rpc ListConfigmapVersions(ListConfigmapVersionsRequest) returns (ListConfigmapVersionsResponse);
  rpc RollbackConfigmap(RollbackConfigmapRequest) returns (ConfigmapResponse);
}


