syntax = "proto3";

package rune.api;

import "pkg/api/proto/common.proto";

option go_package = "github.com/runestack/rune/pkg/api/generated";

message Secret {
  string name = 1;
  string namespace = 2;
  string type = 3; // "static" for MVP
  // data is the plaintext secret payload. Only populated by RevealSecret responses
  // and by client-supplied Create/Update requests. Get/List return it empty;
  // metadata callers should use data_keys instead.
  map<string, string> data = 4;
  int32 version = 5;
  string created_at = 6;
  string updated_at = 7;
  // data_keys lists the keys present in data without revealing values.
  // Populated by Get/List/Reveal responses; ignored on Create/Update requests.
  repeated string data_keys = 8;
}

message CreateSecretRequest {
  Secret secret = 1;
  bool ensure_namespace = 2;
}

message GetSecretRequest {
  string name = 1;
  string namespace = 2;
}

message UpdateSecretRequest {
  Secret secret = 1;
}

// PatchSecretRequest performs a key-scoped merge update of a secret's data
// without ever returning plaintext to the caller. Set entries upsert; unset
// keys are removed. If the resulting data map equals the current head, the
// operation is a no-op (no new version, no audit event). Auth requires only
// secrets:update — never secrets:reveal — because the server reads/merges
// internally and the response carries metadata only.
message PatchSecretRequest {
  string name = 1;
  string namespace = 2;
  // Keys to upsert into the existing data map. Values are taken verbatim.
  map<string, string> set = 3;
  // Keys to remove from the existing data map. Missing keys are silently
  // ignored (the operation is idempotent).
  repeated string unset = 4;
}

message DeleteSecretRequest {
  string name = 1;
  string namespace = 2;
}

message ListSecretsRequest {
  string namespace = 1;

  // Filter services by label
  map<string, string> label_selector = 2;

  // Filter services by field
  map<string, string> field_selector = 3;
  
  // Paging parameters
  PagingParams paging = 4;
}

message ListSecretsResponse {
  repeated Secret secrets = 1;
  Status status = 2;
}

message SecretResponse {
  Secret secret = 1;
  Status status = 2;
}

message RevealSecretRequest {
  string name = 1;
  string namespace = 2;
}

message ListSecretVersionsRequest {
  string name = 1;
  string namespace = 2;
}

message ListSecretVersionsResponse {
  // Versions are returned newest-first by Secret.version. Plaintext data is
  // omitted; only data_keys is populated. Callers needing plaintext for a
  // specific version must call RevealSecretVersion.
  repeated Secret versions = 1;
  Status status = 2;
}

message RevealSecretVersionRequest {
  string name = 1;
  string namespace = 2;
  int32 version = 3;
}

message RollbackSecretRequest {
  string name = 1;
  string namespace = 2;
  // to_version is the historical version number to rewrite into a new HEAD.
  // The rollback writes a brand-new version (head+1) carrying the prior
  // version's data; old versions are retained in history.
  int32 to_version = 3;
}

service SecretService {
  rpc CreateSecret(CreateSecretRequest) returns (SecretResponse);
  // GetSecret returns secret metadata only (no plaintext data). Use RevealSecret
  // to retrieve the plaintext payload; callers must hold the secrets:reveal verb.
  rpc GetSecret(GetSecretRequest) returns (SecretResponse);
  rpc UpdateSecret(UpdateSecretRequest) returns (SecretResponse);
  // PatchSecret merges set/unset entries into the existing data map under a
  // per-secret lock and writes a new version. The response is metadata-only
  // (no plaintext) so callers only need secrets:update — never
  // secrets:reveal. An audit event with action=patch records the key names
  // that were set/unset; values are never logged.
  rpc PatchSecret(PatchSecretRequest) returns (SecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (Status);
  // ListSecrets returns secret metadata only (no plaintext data).
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // RevealSecret returns the plaintext data map for a single secret. Requires
  // the secrets:reveal verb. Each successful call emits an audit event.
  rpc RevealSecret(RevealSecretRequest) returns (SecretResponse);
  // ListSecretVersions returns metadata for every historical version, newest
  // first. Gated by secrets:get.
  rpc ListSecretVersions(ListSecretVersionsRequest) returns (ListSecretVersionsResponse);
  // RevealSecretVersion returns the plaintext payload of a specific historical
  // version. Gated by secrets:reveal.
  rpc RevealSecretVersion(RevealSecretVersionRequest) returns (SecretResponse);
  // RollbackSecret rewrites HEAD to the contents of a prior version, producing
  // a new version. Gated by secrets:update; emits a `rollback` audit event.
  rpc RollbackSecret(RollbackSecretRequest) returns (SecretResponse);
}


