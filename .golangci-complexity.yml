# Complexity gate, run as a second pass by `make lint-complexity`.
#
# Separate from .golangci.yml because of `new-from-merge-base` below: that
# setting filters *every* linter in the run down to changed lines, so folding
# it into the main config would silently turn the whole-tree gofmt/govet/
# staticcheck gate into a diff-only one. Two passes, two configs.
#
# gocognit rather than gocyclo because gocyclo counts branches without caring
# how deeply they nest: methodToAction (pkg/api/server/utils.go) is a flat
# switch that scores 67, the highest in the tree, and reads fine. gocognit
# scores it 0 and still charges planUpdate 44 for its nesting.

run:
  timeout: 5m
  # Matches .golangci.yml. Test helpers nest as deep as anything in pkg/ and
  # there is no reason to exempt them; it costs 26 more backlog entries, none
  # of which the filter below can surface.
  tests: true

linters:
  disable-all: true
  enable:
    - gocognit
    # One `//nolint:gocognit` silently defeats this whole file, so make the
    # suppressions say which linter and why. It does not stop a bypass — it
    # makes one visible in review, which is the most a lint can do here.
    - nolintlint

linters-settings:
  gocognit:
    min-complexity: 20
  nolintlint:
    require-specific: true
    require-explanation: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

  # Only judge what a branch adds. ~197 functions in the tree are already over
  # the threshold (`make lint-complexity-report` lists them), so an unfiltered
  # gate could never go green.
  #
  # What this catches, measured rather than assumed: gocognit reports at the
  # func declaration line and the filter keeps only issues on changed lines. A
  # new function over the threshold fails. An existing one does not — not even
  # when the branch is what pushed it over, because its declaration line did
  # not move. It stops new complex *functions*, not new complexity.
  #
  # It also fires on a byte-identical move, since relocating a function makes
  # its declaration line new. A decomposition PR that relocates an offender
  # must rewrite it or suppress it in the same PR.
  #
  # `make lint-complexity` overrides the base ref, so a branch stacked on
  # another feature branch is judged against its own parent.
  #
  # Removing this line is the goal, and needs the backlog gone first.
  new-from-merge-base: origin/dev

  exclude-dirs:
    - vendor/
    - examples/
