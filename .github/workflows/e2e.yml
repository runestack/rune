name: E2E Tests (Manual)

on:
  workflow_dispatch:

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true

      # Pre-pull the image the dataplane tests cast, so a Docker Hub
      # rate-limit or slow pull mid-test doesn't read as a Rune bug.
      - name: Pre-pull test images
        run: docker pull nginx:alpine

      - name: Run E2E tests
        run: make test-e2e
        env:
          RUNE_E2E_HEALTH_TIMEOUT_SECONDS: "60"
