name: Rune CI

on:
  # push on default branches only; PR updates use pull_request (avoids double runs)
  push:
    branches: [ main, master, dev ]
  # Any base branch, so PRs stacked on another PR get CI too.
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No merge base means revgrep cannot filter, and the complexity gate
          # fails the job with ~200 pre-existing findings.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
      - name: Install tools
        run: make setup
      - name: Lint
        # Judge a stacked branch against its own parent. Via env, not `run:`
        # interpolation — refnames may contain shell metacharacters.
        env:
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: make lint COMPLEXITY_BASE="origin/$BASE_REF"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
      # Seed the image the docker runner tests use. Shared runners hit Docker
      # Hub's anonymous pull rate limit ("toomanyrequests"), so pull from the
      # ECR Public mirror of the Docker official images (no anonymous limit)
      # and retag; fall back to Docker Hub if the mirror is unavailable. The
      # tests use imagePull=missing, so a seeded image means zero Hub pulls.
      - name: Seed test images (avoid Docker Hub rate limits)
        run: |
          if docker pull public.ecr.aws/docker/library/alpine:latest; then
            docker tag public.ecr.aws/docker/library/alpine:latest alpine:latest
          else
            for i in 1 2 3; do docker pull alpine:latest && break || sleep $((i * 15)); done
          fi
      - name: Run unit tests with race detection
        run: make test-unit-race
      # Replays a volume upgrade on loop devices with real Docker binds:
      # needs root, losetup and a Docker daemon, which the runner has and the
      # privileged container below does not. Root gets its own Go cache so
      # the runner's cache is not left root-owned.
      - name: Volume upgrade drill (root, Docker)
        run: |
          sudo -E env "PATH=$PATH" GOCACHE=/tmp/gocache-root GOMODCACHE=/tmp/gomod-root \
            RUNE_REQUIRE_PRIVILEGED_MOUNT=1 RUNE_REQUIRE_DOCKER=1 \
            go test ./internal/agent/volumes -run Linux -count=1 -v
      - name: Check Coverage
        env:
          COVERAGE_THRESHOLD: ${{ secrets.COVERAGE_THRESHOLD }}
        run: make check-coverage
      # The volume teardown tests need CAP_SYS_ADMIN: umount(2) and loop
      # mounts are unavailable to the ordinary runner user, so the tests that
      # matter most skip silently in the job above. Without this step the
      # package's central guarantee — that a detach cannot discard writes a
      # container still holds — is asserted only by comments.
      - name: Volume teardown tests (privileged)
        run: |
          docker run --rm --privileged -e RUNE_REQUIRE_PRIVILEGED_MOUNT=1 \
            -v "$PWD":/src -w /src golang:1.25 sh -c '
            apt-get -qq update && apt-get -qq install -y e2fsprogs fdisk >/dev/null &&
            go test ./pkg/storage/... ./internal/agent/volumes/... -v'

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true
          cache: true
      - name: Build
        run: make build

  docker-build:
    name: Docker Build (sanity)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        run: docker build --no-cache -t local/rune:ci .

